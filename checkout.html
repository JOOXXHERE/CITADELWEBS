<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITADELWEBS</title>
    <link rel="icon" type="image/jpeg" href="citadel_logo.jpg">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="custom.css">
    <style>
        .checkout-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            background: linear-gradient(135deg, #f0f7ff 0%, #ffffff 100%);
        }

        .checkout-container {
            width: 100%;
            max-width: 800px;
            padding: 60px;
            text-align: center;
        }

        .features-list {
            margin-bottom: 40px;
            text-align: left;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .features-list h1 {
            font-size: 45px;
            margin-bottom: 25px;
            text-align: center;
            font-family: 'Outfit', sans-serif;
        }

        .features-list ul {
            list-style: none;
            padding: 0;
            color: var(--text-muted);
            font-size: 18px;
        }

        .features-list li {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .features-list li i {
            color: var(--primary);
            font-size: 20px;
        }

        .call-box {
            padding: 40px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 40px auto;
        }

        .call-box h3 {
            font-size: 26px;
            margin-bottom: 25px;
            font-family: 'Outfit', sans-serif;
        }

        .form-group input {
            width: 100%;
            padding: 18px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            margin-bottom: 25px;
            font-size: 16px;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 98, 255, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 98, 255, 0.3);
        }

        .back-link {
            position: absolute;
            top: 40px;
            left: 40px;
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #success-message {
            margin-top: 25px;
            padding: 20px;
            background: rgba(0, 200, 0, 0.05);
            border: 1px solid #28a745;
            border-radius: 12px;
            color: #28a745;
            font-weight: 600;
        }
    </style>
</head>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="citadel_logo.jpg" alt="CITADELWEBS Logo">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="projects.html">Works</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Works</a>

    <main class="checkout-page">
        <div class="checkout-container glass-card reveal active">
            <div class="features-list">
                <h1>Strategy <span>Session</span></h1>
                <ul>
                    <li><i class="fas fa-video"></i> 45-Minute Live Strategy Call</li>
                    <li><i class="fas fa-chart-line"></i> Digital Growth Roadmap</li>
                    <li><i class="fas fa-shield-alt"></i> Tech Stack Security Audit</li>
                </ul>
            </div>

            <div class="call-box">
                <h3>Reserve Your Spot</h3>
                <form id="registration-form" action="https://docs.google.com/forms/d/e/1FAIpQLSfHvPKR98Z6UxrvZWNefIS4r5iQWYkeOmm6xeRufBupeS5dvw/formResponse" method="POST">
                    <div class="form-group">
                        <input type="email" id="email" name="entry.2037064031" placeholder="Enter your business email" required>
                    </div>
                    <input type="hidden" name="fvv" value="1">
                    <input type="hidden" name="pageHistory" value="0">
                    <input type="hidden" name="fbzx" value="4096226219261270335">
                    <button type="submit" class="btn-submit">Book Session</button>
                </form>

                <div id="success-message" style="display: none;">
                    <i class="fas fa-check-circle" style="font-size: 24px; margin-bottom: 10px;"></i><br>
                    Registration Successful! Check your inbox for confirmation details.
                </div>
            </div>

            <a href="index.html" class="btn-clean">Explore More</a>
        </div>
    </main>

    <script>
        const form = document.getElementById('registration-form');
        const successMessage = document.getElementById('success-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            
            form.style.display = 'none';
            successMessage.style.display = 'block';

            try {
                await fetch(form.action, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });
            } catch (err) {
                console.error("Submission error", err);
            }
        });
    </script>

    <script src="main.js"></script>
</body>
</html>
