<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITADELWEBS</title>
    <link rel="icon" type="image/jpeg" href="citadel_logo.jpg">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="custom.css">
    <style>
        .resources-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 100px 20px;
            background: linear-gradient(135deg, #f0f7ff 0%, #ffffff 100%);
        }

        .resources-header h1 {
            font-size: 50px;
            margin-bottom: 20px;
            font-family: 'Outfit', sans-serif;
        }

        .resources-grid {
            margin-top: 50px;
            width: 100%;
            max-width: 700px;
        }

        .resource-card {
            padding: 40px;
            border-radius: 24px;
        }

        .resource-icon {
            font-size: 50px;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .back-home {
            margin-top: 50px;
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }

        .back-home:hover {
            letter-spacing: 1px;
        }

        .btn-download {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-download:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 98, 255, 0.3);
        }
    </style>
</head>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="citadel_logo.jpg" alt="CITADELWEBS Logo">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="projects.html">Works</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="resources-page">
        <div class="resources-header reveal active">
            <h1>Exclusive <span>Resources</span></h1>
            <p>Tools and assets to help you scale your digital presence.</p>
        </div>

        <div class="resources-grid">
            <div class="resource-card glass-card reveal active">
                <div class="resource-icon">
                    <i class="fas fa-tools"></i>
                </div>
                <h3>Brand Audit Toolkit</h3>
                <p>A comprehensive guide and toolset for analyzing your current brand performance.</p>
                <a href="#" class="btn-download">
                    <i class="fas fa-download"></i> Download Toolkit
                </a>
            </div>
        </div>

        <a href="index.html" class="back-home">← Back to Home</a>
    </main>

    <script src="main.js"></script>
</body>
</html>
